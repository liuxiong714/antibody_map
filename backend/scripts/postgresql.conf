# ============================================================
# PostgreSQL 安全与可靠性配置
# 挂载到容器 /etc/postgresql/postgresql.conf 并由 docker-compose 的 command 引用
# 目的：确保 commit 返回前 WAL 一定刷盘，防止容器被强制终止时最近写入丢失
# ============================================================

# ---- 网络监听（显式指定，确保 Docker 容器间通信可用） ----
listen_addresses = '*'            # 监听所有接口（容器内默认 localhost 会导致网络连接失败！）

# ---- 事务耐久性（默认已开，显式写出来防止意外覆盖） ----
fsync = on                        # 强制 WAL 每次写入都 fsync 刷物理盘（最关键！）
synchronous_commit = on           # 等待 WAL 真正刷盘后才给客户端 ACK
wal_level = replica               # WAL 级别（支持归档复制，预留未来扩展）
max_wal_size = 2GB                # WAL 循环文件上限，自动 checkpoint
min_wal_size = 80MB               # checkpoint 后不会回收低于此值的 WAL

# ---- 关闭容器时强制 checkpoint ----
# 容器正常 stop 时 postgres 会自己做 checkpoint；
# 如果被 SIGKILL 或主机突然断电，下一次启动时 WAL replay 会自动恢复

# ---- 连接/并发 ----
max_connections = 200
shared_buffers = 128MB            # 容器内存限制 1g，约 1/8 给 shared_buffer
effective_cache_size = 512MB      # 告诉查询规划器可用缓存大小

# ---- 日志 ----
log_destination = stderr
logging_collector = off           # alpine 镜像没有日志收集器，写 stderr 由 docker 收集即可
log_min_duration_statement = 1000 # 慢查询（>=1s）记日志
