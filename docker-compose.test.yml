# V5-02: E2E 测试依赖 — 独立于生产 docker-compose.yml（不同端口/网络/卷名）
#
# 设计原则:
#   1. postgres:15-alpine 镜像**自带** postgresql-client（pg_dump/pg_restore/psql），
#      所以 E2E 测试脚本可以直接 `docker exec antibody-test-postgres pg_dump ...`
#   2. 用独立卷（antibody_test_postgres_data 等），不碰生产数据
#   3. 用端口 15432/16379/19000 避开生产默认端口，防止误连
#
# 启动:  docker compose -f docker-compose.test.yml up -d --wait
# 停止:  docker compose -f docker-compose.test.yml down -v   （带 -v 清卷，保证干净）
# 健康:  docker compose -f docker-compose.test.yml ps

name: antibody_test  # 隔离项目名 — 避免与生产 compose 共享网络/卷
services:
  postgres:
    image: postgres:15-alpine
    container_name: antibody-test-postgres
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_DB: antibody_map_test
      POSTGRES_USER: antibody
      POSTGRES_PASSWORD: antibody_test_pw
    volumes:
      - test_postgres_data:/var/lib/postgresql/data
      # 复用生产 init_db.sql —— 确保表结构一致
      - ./backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antibody -d antibody_map_test"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: antibody-test-redis
    command: redis-server --requirepass antibody_test_pw
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - test_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a antibody_test_pw ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: antibody-test-minio
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    environment:
      MINIO_ROOT_USER: antibody_test
      MINIO_ROOT_PASSWORD: antibody_test_pw
    volumes:
      - test_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  test_postgres_data:
    name: antibody_test_postgres_data
  test_redis_data:
    name: antibody_test_redis_data
  test_minio_data:
    name: antibody_test_minio_data
