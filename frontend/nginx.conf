server {
    listen 80;
    server_name _;

    # 文件上传大小限制（略大于后端 MAX_UPLOAD_SIZE=50MB）
    client_max_body_size 60m;

    root /usr/share/nginx/html;
    index index.html;

    # 安全响应头（HTML 文档与静态资源）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # gzip 压缩
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 静态资源缓存
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ES Module（*.mjs，如 pdf.js 的 worker）：nginx 默认 mime.types 无 mjs 条目，
    # 会以 application/octet-stream 返回，配合 nosniff 导致浏览器拒绝执行（
    # "Failed to fetch dynamically imported module"）。此处强制 text/javascript。
    location ~* \.mjs$ {
        types { text/javascript mjs; }
        default_type text/javascript;
        add_header Cache-Control "public, immutable";
        expires 30d;
        try_files $uri =404;
    }

    # 反向代理后端 API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # 中国地图 GeoJSON
    location /china.json {
        try_files $uri $uri/ /index.html;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}