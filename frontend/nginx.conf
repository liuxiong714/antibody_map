server {
    listen 80;
    server_name _;

    # 文件上传大小限制（略大于后端 MAX_UPLOAD_SIZE=50MB）
    client_max_body_size 60m;

    root /usr/share/nginx/html;
    index index.html;

    # 安全响应头（HTML 文档与静态资源）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # gzip 压缩
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 静态资源缓存
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ES Module（*.mjs，如 pdf.js 的 worker）：nginx 默认 mime.types 无 mjs 条目，
    # 会以 application/octet-stream 返回，配合 nosniff 导致浏览器拒绝执行（
    # "Failed to fetch dynamically imported module"）。此处强制 text/javascript。
    location ~* \.mjs$ {
        types { text/javascript mjs; }
        default_type text/javascript;
        add_header Cache-Control "public, immutable";
        expires 30d;
        try_files $uri =404;
    }

    # 反向代理后端 API
    # 使用 Docker 内嵌 DNS(127.0.0.11) + resolver + 变量，让 nginx 按 TTL 周期重新解析
    # backend 主机名。否则 nginx 对字面量 host 仅在配置加载时解析一次并永久缓存，
    # backend 容器重建换 IP(如 172.18.0.8 -> 172.18.0.2)后会导致全站 502。
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 报告生成同步长连接、连续调本地大模型，GPU 并发时总耗时可能远超 600s，
        # 放宽到 3600s，避免生成中途 nginx 返回 502/断开（前端 axios 1800s 配套）。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
    }

    # 中国地图 GeoJSON
    location /china.json {
        try_files $uri $uri/ /index.html;
    }

    # 入口 HTML 禁止缓存：Vite 产物为内容哈希文件名，浏览器只要拿到最新 index.html
    # 就会自动加载新的哈希 bundle；若 HTML 被缓存则永远指向旧 JS（如 PdfViewer 改动
    # 后仍显示旧错误版）。此处让浏览器每次重新校验，避免“改了代码刷新后仍是旧界面”。
    location = /index.html {
        # 只用一条 add_header 声明缓存策略，避免与 expires 把 Cache-Control 叠加成两条
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}