services:
  postgres:
    image: postgres:15-alpine
    container_name: antibody-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: antibody_map
      POSTGRES_USER: antibody
      POSTGRES_PASSWORD: antibody123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antibody"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - antibody-net

  redis:
    image: redis:7-alpine
    container_name: antibody-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - antibody-net

  minio:
    image: minio/minio
    container_name: antibody-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: antibody
      MINIO_ROOT_PASSWORD: antibody123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - antibody-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: antibody-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # 日志/时间与宿主机一致（北京时间）
      TZ: Asia/Shanghai
      # 容器内通过服务名访问基础设施
      DATABASE_URL: postgresql+asyncpg://antibody:antibody123@postgres:5432/antibody_map
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/logs:/app/backend/logs
    networks:
      - antibody-net

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        # worker 需要 MinerU 增强 PDF 解析（backend 不装，避免 torch 拖慢 API）
        INSTALL_MINERU: "true"
    container_name: antibody-worker
    env_file:
      - .env
    environment:
      # 日志/时间与宿主机一致（北京时间）
      TZ: Asia/Shanghai
      DATABASE_URL: postgresql+asyncpg://antibody:antibody123@postgres:5432/antibody_map
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      # 本地 Ollama 模型按需并发数，须与 LLM_CONCURRENCY 保持一致
      OLLAMA_NUM_PARALLEL: "${OLLAMA_NUM_PARALLEL:-1}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/logs:/app/backend/logs
      # MinerU 模型缓存持久化：挂载到宿主机，容器重建后无需重新下载模型（约 2.2G）
      - ./backend/data/mineru_cache:/root/.cache/modelscope
    command: celery -A app.tasks.celery_app worker --loglevel=info --pool=prefork --concurrency=1
    networks:
      - antibody-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: antibody-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - antibody-net

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  antibody-net:
    driver: bridge