services:
  postgres:
    image: postgres:15-alpine
    container_name: antibody-postgres
    ports:
      # 仅绑定回环地址，禁止暴露到公网
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: antibody_map
      POSTGRES_USER: antibody
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antibody"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
    networks:
      - antibody-net

  redis:
    image: redis:7-alpine
    container_name: antibody-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - antibody-net

  minio:
    image: minio/minio
    container_name: antibody-minio
    ports:
      # 仅绑定回环地址，禁止暴露到公网
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: antibody
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          memory: 1g
    networks:
      - antibody-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: antibody-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # 日志/时间与宿主机一致（北京时间）
      TZ: Asia/Shanghai
      # 容器内通过服务名访问基础设施
      DATABASE_URL: ${DATABASE_URL:?}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MINIO_ENDPOINT: minio:9000
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 最小权限加固：丢弃全部 Linux 能力、根文件系统只读（可写数据全走 volume），
    # 临时写目录挂到 tmpfs，降低容器被入侵后对宿主的影响面
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    # 内存上限：防止异常占用拖垮宿主机（OOM 由内核强制终止容器而非宿主）
    deploy:
      resources:
        limits:
          memory: 4g
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/logs:/app/backend/logs
      - ./backups:/app/backend/backups
      # 文件夹监控目录
      - /mnt/e/01-liuxiong/antibody_map_ref/ref:/app/monitor/ref
    networks:
      - antibody-net

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        # worker 需要 MinerU 增强 PDF 解析（backend 不装，避免 torch 拖慢 API）
        INSTALL_MINERU: "true"
    container_name: antibody-worker
    env_file:
      - .env
    environment:
      # 日志/时间与宿主机一致（北京时间）
      TZ: Asia/Shanghai
      DATABASE_URL: ${DATABASE_URL:?}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MINIO_ENDPOINT: minio:9000
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      # 本地 Ollama 模型按需并发数，须与 LLM_CONCURRENCY 保持一致
      OLLAMA_NUM_PARALLEL: "${OLLAMA_NUM_PARALLEL:-2}"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 最小权限加固（同 backend）
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /dev/shm
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/logs:/app/backend/logs
      # MinerU 模型缓存持久化：挂载到宿主机，容器重建后无需重新下载模型（约 2.2G）
      - ./backend/data/mineru_cache:/root/.cache/modelscope
      # 文件夹监控目录
      - /mnt/e/01-liuxiong/antibody_map_ref/ref:/app/monitor/ref
    # 内存上限 8g：MinerU + torch 推理 + 2 并发 Celery worker 峰值内存可达数 GB
    deploy:
      resources:
        limits:
          memory: 8g
    # GPU 透传默认关闭：无 NVIDIA Container Toolkit 的宿主机也能正常启动。
    # 有 GPU 的宿主机请追加 docker-compose.gpu.yml：
    #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
    # worker 健康检查：pid 1 是 celery 常驻进程，检查 broker(redis) 连通性即可确认存活
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,redis; redis.Redis.from_url(os.environ['CELERY_BROKER_URL']).ping()\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: celery -A app.tasks.celery_app worker --loglevel=info --pool=prefork --concurrency=2
    networks:
      - antibody-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: antibody-frontend
    ports:
      - "8080:80"
    healthcheck:
      # 用 127.0.0.1 而非 localhost：busybox wget 将 localhost 解析为 ::1 (IPv6)，
      # 而 nginx 仅监听 IPv4，会导致连接被拒、健康检查误判失败
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    depends_on:
      - backend
    # nginx 需写缓存/pid/临时目录，read_only 下用 tmpfs 覆盖；
    # 不能 cap_drop ALL（会去掉 CHOWN/SETUID，nginx 无法 chown 缓存目录而启动失败），
    # 改为按需放行 nginx 必需的少量能力
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - KILL
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /run
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - antibody-net

  # ---- 可观测性（可选，仅本机访问）----
  # 采集 backend 的 /metrics 并展示。注意：/metrics 仅在开发环境(APP_ENV=development)
  # 或客户端 IP 命中 METRICS_ALLOW_IPS 白名单时开放；生产环境需在 .env 中
  # 将 prometheus 容器网关 IP 加入 METRICS_ALLOW_IPS 才能抓取成功。
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: antibody-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - antibody-net

  grafana:
    image: grafana/grafana:11.1.0
    container_name: antibody-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # 建议在 .env 中设置 GRAFANA_ADMIN_PASSWORD，避免使用默认口令
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    networks:
      - antibody-net

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  antibody-net:
    driver: bridge