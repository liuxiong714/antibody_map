name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Backend & Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # CI 测试环境配置：满足 app.config.Settings 启动校验。
      # SECRET_KEY 必须 >= 32 字符；APP_ENV=development 仅用于绕过生产态口令护栏，
      # 并非生产配置（本地运行亦通过显式 _cfg() 构造验证生产约束）。
      SECRET_KEY: "ci-only-non-prod-secret-key-0123456789abcdef"
      APP_ENV: "development"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          cd backend
          # 测试依赖（pytest/pytest-asyncio/pytest-cov/coverage）固化在 requirements-dev.txt
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run offline backend tests
        run: |
          cd backend
          python -m pytest -p no:cacheprovider --cov=app --cov-report=term-missing --cov-fail-under=45 -q

      - name: Lint backend with ruff
        run: |
          cd backend
          pip install ruff
          ruff check app --output-format=github

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 26：与本地验证环境一致（Node 20 上 jsdom 依赖的 undici 缺
          # webidl.util.markAsUncloneable，vitest worker 启动崩溃）
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Type-check frontend
        run: cd frontend && npx tsc --noEmit

      - name: Test frontend
        run: cd frontend && npx vitest run --coverage

      - name: Build frontend
        run: cd frontend && npm run build
        env:
          # 生产构建使用相对路径 /api/v1（见 services/api.ts 的 baseURL），后端经反向代理提供，
          # 此处置空可确保构建不依赖任何外部服务
          VITE_API_BASE: ''