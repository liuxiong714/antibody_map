name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Backend & Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          cd backend
          # 测试依赖（pytest/pytest-asyncio/pytest-cov/coverage）固化在 requirements-dev.txt
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run offline backend tests
        run: |
          cd backend
          set +e
          {
            echo "=== ENV ==="; echo "SECRET_KEY_LEN=${#SECRET_KEY} APP_ENV=$APP_ENV"
            echo "=== PYVER ==="; python --version 2>&1
            echo "=== RUN ==="; python -m pytest -p no:cacheprovider --cov=app --cov-report=term-missing --cov-fail-under=45 -q 2>&1
            echo "=== EXIT=$? ==="
          } > /tmp/diag.out 2>&1
          DETAIL=$(tail -40 /tmp/diag.out | tr '\n' ';' | cut -c1-6000)
          echo "::error title=ci-diag::$DETAIL"
          exit 4

      - name: Lint backend with ruff
        run: |
          cd backend
          pip install ruff
          ruff check app --output-format=github

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Type-check frontend
        run: cd frontend && npx tsc --noEmit

      - name: Test frontend
        run: cd frontend && npx vitest run --coverage

      - name: Build frontend
        run: cd frontend && npm run build
        env:
          # 生产构建使用相对路径 /api/v1（见 services/api.ts 的 baseURL），后端经反向代理提供，
          # 此处置空可确保构建不依赖任何外部服务
          VITE_API_BASE: ''