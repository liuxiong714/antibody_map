# V5-02 → V6-01 E2E 端到端测试（备份恢复 / 提取落库 / 幂等 / 报告溯源）
#
# 触发方式:
#   - workflow_dispatch: 在 GitHub Actions 页面手动点 "Run workflow"
#   - schedule: 每周一 06:00 UTC（nightly）
#   - 不自动触发 push/PR —— 避免拖慢每次 commit 的反馈循环
#
# V6-01 改动:
#   - pg_dump/psql 不再用 docker exec / WSL；统一走 DSN 直连 E2E_PG_HOST/PORT/USER/DB/PASSWORD
#   - E2E_REQUIRE=1: CI 环境下缺失 pg_dump/psql 必须 fail 而非 skip（防止静默跳过）
#   - CI postgres service 的 host=127.0.0.1 / port=5432 / db=antibody_map_e2e 与 E2E_PG_* 对齐

name: E2E Tests

on:
  workflow_dispatch:          # 手动触发
  schedule:
    - cron: "0 6 * * 1"        # 每周一 06:00 UTC = 北京时间 14:00

jobs:
  e2e:
    name: Backup restore + Extract conflict + Idempotent + Report tracing
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # ===== DATABASE_URL: async engine（common.py e2e_engine_session 读这个）=====
      DATABASE_URL: "postgresql+asyncpg://antibody:antibody_test_pw@localhost:5432/antibody_map_e2e"
      # ===== V6-01: E2E_PG_* — pg_dump/psql subprocess 连接参数（DSN 直连）=====
      E2E_PG_HOST: "127.0.0.1"
      E2E_PG_PORT: "5432"
      E2E_PG_USER: "antibody"
      E2E_PG_DB: "antibody_map_e2e"
      E2E_PG_PASSWORD: "antibody_test_pw"
      E2E_REQUIRE: "1"         # CI 严格模式：缺失 pg 工具必须 fail 而非 skip
      # ===== 其他 =====
      SECRET_KEY: "e2e-only-non-prod-secret-key-0123456789abcdef"
      APP_ENV: "development"

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: antibody_map_e2e
          POSTGRES_USER: antibody
          POSTGRES_PASSWORD: antibody_test_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        command: redis-server --requirepass antibody_test_pw
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a antibody_test_pw ping | grep -q PONG"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies + pg client tools
        run: |
          cd backend
          pip install -r requirements.txt -r requirements-dev.txt
          # V6-01: pg_dump/pg_restore/psql 必须在 PATH 上（DSN 直连方案需要）
          apt-get update -qq && apt-get install -y -qq postgresql-client > /dev/null
          which pg_dump pg_restore psql

      - name: Run Alembic migrations against E2E DB
        run: |
          cd backend
          alembic upgrade head

      - name: Run E2E tests (all 6 suites)
        run: |
          cd backend
          pytest tests/e2e/ -v --run-e2e --tb=short 2>&1 | tee /tmp/e2e.log
        # 所有 E2E 必须全绿才通过

      - name: Run data health check (nightly gate)
        if: github.event_name == 'schedule'
        run: |
          cd backend
          # V6-04: 6 条数据红线巡检脚本化，nightly 自动跑
          # error 类非 0 即 exit 1 → 让 job 失败并在 Slack/邮件告警
          # warning 类（pending_older_than_7d）为业务豁免，不计入失败
          python scripts/check_health.py --db-url "${DATABASE_URL}" 2>&1 | tee /tmp/health.log
        # nightly 专属门禁：数据红线 0 条失败

      - name: Upload E2E log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-log
          path: /tmp/e2e.log
