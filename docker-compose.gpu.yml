# 可选 GPU 加速 overlay：仅在宿主机装有 NVIDIA Container Toolkit 时使用。
# 用法（worker 会获得全部 GPU 透传）：
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# 默认不加此文件时，worker 不请求 GPU，任何宿主机都能正常启动。
services:
  worker:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]